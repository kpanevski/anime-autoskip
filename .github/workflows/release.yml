name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check manifest version matches tag
        run: |
          version="v$(jq -r .version manifest.json)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::manifest.json says $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Build zip
        run: git archive --format=zip -o "anime-autoskip-$GITHUB_REF_NAME.zip" HEAD

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "anime-autoskip-$GITHUB_REF_NAME.zip"
          --title "$GITHUB_REF_NAME" --generate-notes
